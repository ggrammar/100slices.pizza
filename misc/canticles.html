<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Witch Hunter Canticles</title>
<style>
  :root {
    --ink: #23272f;
    --paper: #f6f4ef;
    --paper-dim: #ebe8e0;
    --rule: #d8d4c8;
    --match: #b5493a;
    --match-bg: #f2d9c9;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 560px;
  }

  .eyebrow {
    font-size: 13px;
    color: #6b6455;
    margin: 0 0 6px;
  }

  h1 {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 28px;
    letter-spacing: -0.01em;
  }

  label {
    display: block;
    font-size: 13px;
    color: #6b6455;
    margin-bottom: 6px;
  }

  .field {
    margin-bottom: 20px;
  }

  input[type="text"] {
    width: 100%;
    font-family: var(--mono);
    font-size: 16px;
    padding: 10px 12px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    background: white;
    color: var(--ink);
  }

  input[type="text"]:focus {
    outline: 2px solid var(--match);
    outline-offset: 1px;
  }

  .sentence {
    font-family: var(--mono);
    font-size: 22px;
    line-height: 1.6;
    padding: 20px;
    background: var(--paper-dim);
    border-radius: 8px;
    border: 1px solid var(--rule);
    word-wrap: break-word;
    min-height: 1.6em;
  }

  .sentence .match {
    background: var(--match-bg);
    color: var(--match);
    font-weight: 700;
    border-radius: 3px;
    padding: 0 1px;
  }

  .status {
    margin-top: 10px;
    font-size: 13px;
    color: #6b6455;
    min-height: 16px;
  }
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">subsequence match</p>

    <div class="field">
      <label for="sentence-input">Sentence</label>
      <input type="text" id="sentence-input" value="
I WILL NOT FEAR THE WIZARD, FOR THEY ARE BLINDED BY AMBITION

I WILL NOT FEAR THE CLERIC, FOR THEY ARE BEHOLDEN TO A DECEIVER

I WILL NOT FEAR THE DRUID, FOR THEY ARE CAGED BY NATURE

I WILL NOT FEAR THE BARD, FOR THEY CORRUPT THE SPIRIT

I WILL NOT FEAR THE SORCERER, FOR THEY ARE SHACKLED BY BLOOD

I WILL NOT FEAR THE MAGUS, FOR THEY KNOW NOT PURITY

I WILL NOT FEAR THE SUMMONER, FOR THEY LEASH TO ABOMINATION

I ALONE WILL WIELD THE DARKNESS
I ALONE WILL PURGE THE CHAOS
">
    </div>

    <div class="field">
      <label for="user-input">Your letters</label>
      <input type="text" id="user-input" placeholder="type here, e.g. yam" autocomplete="off">
    </div>

    <div id="sentence" class="sentence"></div>
    <div id="status" class="status"></div>
  </div>

<script>
  const sentenceInput = document.getElementById('sentence-input');
  const userInput = document.getElementById('user-input');
  const sentenceDisplay = document.getElementById('sentence');
  const status = document.getElementById('status');

  // Walk the sentence left to right, and for each character of the
  // user's input (in order), consume the next matching letter found.
  function renderHighlight(sentence, query) {
    const q = query.toLowerCase();
    let qi = 0;
    let matched = 0;
    const frag = document.createDocumentFragment();

    for (const ch of sentence) {
      if (qi < q.length && ch.toLowerCase() === q[qi]) {
        const span = document.createElement('span');
        span.className = 'match';
        span.textContent = ch;
        frag.appendChild(span);
        qi++;
        matched++;
      } else {
        frag.appendChild(document.createTextNode(ch));
      }
    }
    return { frag, matched, total: q.replace(/\s/g, '').length || q.length };
  }

  function update() {
    const sentence = sentenceInput.value;
    const query = userInput.value;

    sentenceDisplay.innerHTML = '';
    const { frag, matched } = renderHighlight(sentence, query);
    sentenceDisplay.appendChild(frag);

    if (!query) {
      status.textContent = '';
    } else if (matched === query.length) {
      status.textContent = `all ${matched} letters matched, in order`;
    } else {
      status.textContent = `${matched} of ${query.length} letters matched so far`;
    }
  }

  sentenceInput.addEventListener('input', update);
  userInput.addEventListener('input', update);
  update();
</script>
</body>
</html>
