<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Witch Hunter Canticles</title>
<style>
  :root {
    --ink: #d1d0cc;
    --dim: #8b8d92;
    --paper: #2b2d31;
    --paper-dim: #232427;
    --rule: #3c3e43;
    --match: #f4f6ff;
    --glow: 176, 195, 255;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 560px;
  }

  .eyebrow {
    font-size: 13px;
    color: var(--dim);
    margin: 0 0 6px;
  }

  h1 {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 28px;
    letter-spacing: -0.01em;
  }

  label {
    display: block;
    font-size: 13px;
    color: var(--dim);
    margin-bottom: 6px;
  }

  .field {
    margin-bottom: 20px;
  }

  input[type="text"] {
    width: 100%;
    font-family: var(--mono);
    font-size: 16px;
    padding: 10px 12px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    background: var(--paper-dim);
    color: var(--ink);
  }

  input[type="text"]::placeholder {
    color: var(--dim);
  }

  input[type="text"]:focus {
    outline: none;
    border-color: rgba(var(--glow), 0.7);
    box-shadow: 0 0 0 3px rgba(var(--glow), 0.18);
  }

  .sentence {
    font-family: var(--mono);
    font-size: 22px;
    line-height: 1.6;
    padding: 20px;
    background: var(--paper-dim);
    color: var(--ink);
    border-radius: 8px;
    border: 1px solid var(--rule);
    word-wrap: break-word;
    white-space: pre-wrap;
    min-height: 1.6em;
  }

  .sentence .match {
    color: var(--match);
    font-weight: 600;
    text-shadow:
      0 0 6px rgba(var(--glow), 0.9),
      0 0 16px rgba(var(--glow), 0.6),
      0 0 32px rgba(var(--glow), 0.35);
  }

  .status {
    margin-top: 10px;
    font-size: 13px;
    color: var(--dim);
    min-height: 16px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="field">
      <input type="hidden" id="sentence-input" value="
I WILL NOT FEAR THE WIZARD, FOR THEY ARE BLINDED BY AMBITION

I WILL NOT FEAR THE CLERIC, FOR THEY ARE BEHOLDEN TO A DECEIVER

I WILL NOT FEAR THE DRUID, FOR THEY ARE CAGED BY NATURE

I WILL NOT FEAR THE BARD, FOR THEY CORRUPT THE SPIRIT

I WILL NOT FEAR THE SORCERER, FOR THEY ARE SHACKLED BY BLOOD

I WILL NOT FEAR THE MAGUS, FOR THEY KNOW NOT PURITY

I WILL NOT FEAR THE SUMMONER, FOR THEY LEASH TO ABOMINATION

I ALONE WILL WIELD THE DARKNESS
I ALONE WILL PURGE THE CHAOS
">
    </div>

    <div class="field">
      <label for="user-input">Your letters</label>
      <input type="text" id="user-input" autocomplete="off">
    </div>

    <div id="sentence" class="sentence"></div>
    <div id="status" class="status"></div>
  </div>

<script>
  const sentenceInput = document.getElementById('sentence-input');
  const userInput = document.getElementById('user-input');
  const sentenceDisplay = document.getElementById('sentence');
  const status = document.getElementById('status');

  function renderHighlight(sentence, query) {
    const q = query.toLowerCase();
    let qi = 0;
    let matched = 0;
    const frag = document.createDocumentFragment();

    for (const ch of sentence) {
      if (qi < q.length && ch.toLowerCase() === q[qi]) {
        const span = document.createElement('span');
        span.className = 'match';
        span.textContent = ch;
        frag.appendChild(span);
        qi++;
        matched++;
      } else {
        frag.appendChild(document.createTextNode(ch));
      }
    }
    return { frag, matched, total: q.replace(/\s/g, '').length || q.length };
  }

  function update() {
    const sentence = sentenceInput.value;
    const query = userInput.value;

    sentenceDisplay.innerHTML = '';
    const { frag, matched } = renderHighlight(sentence, query);
    sentenceDisplay.appendChild(frag);

  }

  sentenceInput.addEventListener('input', update);
  userInput.addEventListener('input', update);
  update();
</script>
</body>
</html>
